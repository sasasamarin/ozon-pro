[project]
name = "ozon-pro-backend"
version = "0.1.0"
description = "Ozon Pro - SaaS аналитики для селлеров"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",

    # Background tasks
    "celery>=5.4.0",
    "redis>=5.2.0",
    "celery-beat-cluster>=0.0.5",

    # HTTP client
    "httpx>=0.27.2",
    "tenacity>=9.0.0",  # retry с backoff

    # Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.3",  # шифрование API ключей

    # AI / ML
    "anthropic>=0.39.0",
    "pandas>=2.2.3",
    "numpy>=2.1.3",

    # Monitoring и логи
    "sentry-sdk[fastapi,celery]>=2.18.0",
    "structlog>=24.4.0",

    # S3 storage
    "boto3>=1.35.60",

    # Email
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",

    # Telegram
    "aiogram>=3.14.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
