[project]
name = "ozon-pro-backend"
version = "0.1.0"
description = "Ozon Pro - SaaS analytics for Ozon marketplace sellers"
requires-python = ">=3.11"
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    
    # Auth — закрепляем bcrypt 4.0.1 чтобы passlib не падал
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    
    # HTTP client
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    
    # Celery
    "celery>=5.4.0",
    "redis>=5.2.0",
    "flower>=2.0.0",
    
    # AWS S3
    "boto3>=1.35.0",
    "aioboto3>=13.2.0",
    
    # Logging
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "pytz>=2024.2",
    "email-validator>=2.2.0",
    "aiosmtplib>=3.0.2",
]
