# ============================================
# OZON PRO - конфиг nginx для домена
# ============================================
# ЗАМЕНИ ozonpro.ru на свой домен!

# HTTP -> HTTPS редирект
server {
    listen 80;
    server_name ozonpro.ru www.ozonpro.ru;

    # Для certbot (выпуск SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name ozonpro.ru www.ozonpro.ru;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ozonpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozonpro.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # Frontend (раскомментировать когда добавим)
    # location / {
    #     proxy_pass http://frontend:5173;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    # Пока всё на API
    location / {
        return 200 'Ozon Pro API running. См. /api/docs';
        add_header Content-Type text/plain;
    }
}
