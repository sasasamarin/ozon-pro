name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"
      - name: Run pytest
        working-directory: backend
        # Dummy env — pydantic-settings валидирует PostgresDsn/RedisDsn при
        # импорте app.core.config (и далее по цепочке app.services.*).
        # Без них pytest падает на collection (exit 2). Сами тесты не ходят
        # в БД/Redis — это юнит-тесты на pure-функциях.
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          DATABASE_URL_SYNC: "postgresql://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
          ENCRYPTION_KEY: "Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Q="
          JWT_SECRET_KEY: "ci-test-secret"
          ALLOWED_HOSTS: "*"
          CORS_ORIGINS: "*"
          ENVIRONMENT: "test"
          S3_BUCKET: "test"
          S3_ACCESS_KEY: "test"
          S3_SECRET_KEY: "test"
          S3_ENDPOINT: "https://s3.example.com"
        run: |
          set +e
          OUT=$(pytest tests/ -v -s --tb=long --no-header 2>&1)
          EC=$?
          echo "$OUT"
          if [ $EC -ne 0 ]; then
            # Берём строки СО ВСЕМ контекстом ошибки: header validation errors +
            # имена полей (имя поля идёт ДО строки "Field required").
            echo "$OUT" | head -100 | grep -E "^[A-Z_]+$|validation errors|Field required|errors.pydantic|^ERROR" | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $EC
